name: Check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup local app
        run: npm run setup

      - name: Fast quality gate
        run: npm run check:source

      - name: Build gate
        run: npm run build

      - name: Documentation gate
        run: npm run check:docs

      - name: Migration gate
        run: npm run db:test:migrations

      - name: Repository hygiene
        run: npm run repo:hygiene

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:e2e:smoke

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-smoke-artifacts
          path: |
            test-results/e2e-artifacts
            playwright-report
          if-no-files-found: ignore

  bullmq-redis:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: BullMQ Redis job validation
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:jobs:redis

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Production and development dependency audit
        run: npm run security:deps

      - name: Secrets, licenses and repository policy
        run: npm run repo:hygiene

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      - name: Enforce high-severity SAST findings
        run: node scripts/check-repo-hygiene.js --sarif "${{ steps.codeql.outputs.sarif-output }}"
