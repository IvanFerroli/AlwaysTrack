{
  "openapi": "3.1.0",
  "info": {
    "title": "AlwaysTrack Core HTTP API",
    "version": "1.0.0",
    "description": "Contrato P0 versionado do AlwaysTrack Core para autenticacao, CaseFlow e Companion. O formato JSON e intencionalmente usado como subconjunto valido de YAML para validacao deterministica sem dependencia adicional."
