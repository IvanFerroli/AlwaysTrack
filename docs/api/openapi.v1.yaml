  "components": {
    "securitySchemes": {
      "sessionCookie": { "type": "apiKey", "in": "cookie", "name": "alwaystrack_session", "description": "Cookie HttpOnly, SameSite=Lax; Secure em producao." },
      "companionCredential": { "type": "apiKey", "in": "header", "name": "Authorization", "description": "Credencial local efemera no formato Companion <credential>; nunca registrar ou incluir em exemplos." }
    },
    "parameters": {
      "CaseId": { "name": "caseId", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 }, "example": "fixture-case-001" },
      "StepKey": { "name": "stepKey", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 }, "example": "confirm-delivery" },
      "MessageId": { "name": "messageId", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 }, "example": "fixture-message-001" },
      "InstallationId": { "name": "installationId", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 }, "example": "fixture-installation-001" },
      "RunId": { "name": "runId", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 }, "example": "fixture-run-001" }
    },
    "schemas": {
      "ApiError": { "type": "object", "additionalProperties": false, "required": ["ok", "error"], "properties": { "ok": { "const": false }, "error": { "type": "object", "additionalProperties": false, "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } },
      "GenericSuccess": { "type": "object", "additionalProperties": false, "required": ["ok", "data"], "properties": { "ok": { "const": true }, "data": {} } },
      "UserRole": { "type": "string", "enum": ["ADMIN", "SAC", "FINANCEIRO", "VENDEDOR", "SUPERVISOR", "GESTOR", "RT"] },
      "CurrentUser": { "type": "object", "additionalProperties": false, "required": ["id", "name", "email", "role", "organizationId", "unitScopeIds", "sectorScopeIds"], "properties": { "id": { "type": "string" }, "name": { "type": "string" }, "email": { "type": "string", "format": "email" }, "avatarUrl": { "type": ["string", "null"] }, "role": { "$ref": "#/components/schemas/UserRole" }, "organizationId": { "type": "string" }, "unitScopeIds": { "type": "array", "items": { "type": "string" } }, "sectorScopeIds": { "type": "array", "items": { "type": "string" } } } },
      "LoginRequest": { "type": "object", "additionalProperties": false, "required": ["email", "password"], "properties": { "email": { "type": "string", "format": "email" }, "password": { "type": "string", "minLength": 1 } } },
      "ServiceCaseStatus": { "type": "string", "enum": ["NEW", "INTAKE_RUNNING", "EVIDENCE_COLLECTING", "PARTIALLY_RESOLVED", "RESOLVED", "GUIDED_EXECUTION", "WAITING_HUMAN", "READY_FOR_RESPONSE", "COMPLETED", "CANCELLED", "FAILED"] },
      "ServiceCase": { "type": "object", "required": ["id", "organizationId", "createdByUserId", "status", "createdAt", "updatedAt"], "properties": { "id": { "type": "string" }, "organizationId": { "type": "string" }, "createdByUserId": { "type": "string" }, "status": { "$ref": "#/components/schemas/ServiceCaseStatus" }, "summary": { "type": ["string", "null"] }, "createdAt": { "type": "string", "format": "date-time" }, "updatedAt": { "type": "string", "format": "date-time" } } },
      "CaseSourceInput": { "type": "object", "additionalProperties": false, "required": ["kind", "sourceReference", "observedAt"], "properties": { "kind": { "type": "string", "enum": ["ALWAYSCHAT", "MANUAL"] }, "sourceReference": { "type": "string", "minLength": 1 }, "sourceUrl": { "type": "string", "format": "uri" }, "observedAt": { "type": "string", "format": "date-time" }, "metadata": { "type": ["object", "array", "string", "number", "boolean", "null"] } } },
      "CreateCaseRequest": { "type": "object", "additionalProperties": false, "properties": { "summary": { "type": "string", "minLength": 1 }, "source": { "$ref": "#/components/schemas/CaseSourceInput" } } },
      "UpdateCaseRequest": { "type": "object", "additionalProperties": false, "properties": { "summary": { "type": ["string", "null"] }, "status": { "$ref": "#/components/schemas/ServiceCaseStatus" }, "reason": { "type": "string", "minLength": 1 } } },
      "EvidenceFactInput": { "type": "object", "required": ["key", "value", "normalizedValue", "sourceSystem", "observedAt", "confidence", "freshness", "sensitivity", "acquisition"], "properties": { "key": { "type": "string", "minLength": 1 }, "value": {}, "normalizedValue": {}, "sourceSystem": { "type": "string", "minLength": 1 }, "sourceReference": { "type": "string" }, "observedAt": { "type": "string", "format": "date-time" }, "collectedAt": { "type": "string", "format": "date-time" }, "confidence": { "type": "number", "minimum": 0, "maximum": 1 }, "freshness": { "type": "string", "enum": ["FRESH", "STALE", "UNKNOWN"] }, "sensitivity": { "type": "string", "enum": ["PUBLIC", "INTERNAL", "PII", "FINANCIAL"] }, "acquisition": { "type": "string", "enum": ["SCRAPED", "MANUAL", "DERIVED"] }, "connectorRunId": { "type": "string" }, "ruleId": { "type": "string" } } },
      "FactsRequest": { "type": "object", "additionalProperties": false, "required": ["facts"], "properties": { "facts": { "type": "array", "minItems": 1, "maxItems": 100, "items": { "$ref": "#/components/schemas/EvidenceFactInput" } } } },
      "StepSelectionRequest": { "type": "object", "additionalProperties": false, "required": ["sessionId", "choice"], "properties": { "sessionId": { "type": "string", "minLength": 1 }, "choice": { "type": "string", "minLength": 1 } } },
      "StepRewindRequest": { "type": "object", "additionalProperties": false, "required": ["sessionId"], "properties": { "sessionId": { "type": "string", "minLength": 1 } } },
      "MetricRequest": { "type": "object", "properties": { "milestone": { "type": "string", "enum": ["sidePanelInteractive", "intakeVisible", "firstPartialSummary", "firstActionableFlow", "slowConnector", "connectorTimeout"] }, "durationMs": { "type": "number", "minimum": 0 }, "counter": { "type": "string" }, "value": { "type": "number" } } },
      "CompanionCredentialRequest": { "type": "object", "additionalProperties": false, "required": ["installationId", "browserProfileId", "extensionInstanceId"], "properties": { "installationId": { "type": "string", "minLength": 1 }, "browserProfileId": { "type": "string", "minLength": 1 }, "extensionInstanceId": { "type": "string", "minLength": 1 } } },
      "CompanionFactsRequest": { "type": "object", "additionalProperties": false, "required": ["installationId", "userId", "browserProfileId", "facts"], "properties": { "installationId": { "type": "string" }, "userId": { "type": "string" }, "browserProfileId": { "type": "string" }, "facts": { "type": "array", "maxItems": 100, "items": { "$ref": "#/components/schemas/EvidenceFactInput" } } } }
    },
    "responses": {
      "GenericSuccess": { "description": "Operacao concluida", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericSuccess" } } } },
      "AuthSuccess": { "description": "Usuario autenticado", "content": { "application/json": { "schema": { "allOf": [{ "$ref": "#/components/schemas/GenericSuccess" }, { "properties": { "data": { "type": "object", "required": ["user"], "properties": { "user": { "$ref": "#/components/schemas/CurrentUser" } } } } }] } } } },
      "CaseSuccess": { "description": "Caso tenant-scoped", "content": { "application/json": { "schema": { "allOf": [{ "$ref": "#/components/schemas/GenericSuccess" }, { "properties": { "data": { "$ref": "#/components/schemas/ServiceCase" } } }] } } } },
      "CaseSourceSuccess": { "description": "Fonte do caso persistida", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericSuccess" } } } },
      "FactsSuccess": { "description": "Evidencias redigidas conforme sensibilidade", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericSuccess" } } } },
      "ConflictsSuccess": { "description": "Conflitos e fatos associados", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericSuccess" } } } },
      "PlanSuccess": { "description": "Plano compilado e historico", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericSuccess" } } } },
      "MessagesSuccess": { "description": "Mensagens compiladas sem escrita externa", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericSuccess" } } } },
      "RecordedSuccess": { "description": "Metrica sanitizada registrada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericSuccess" }, "example": { "ok": true, "data": { "recorded": true } } } } },
      "InvalidInput": { "description": "Entrada invalida", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ApiError" }, "example": { "ok": false, "error": { "code": "INVALID_INPUT", "message": "Invalid CaseFlow request." } } } } },
      "Unauthenticated": { "description": "Sessao ou credencial ausente/invalida", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ApiError" }, "example": { "ok": false, "error": { "code": "UNAUTHENTICATED", "message": "Login required." } } } } },
      "Forbidden": { "description": "Papel sem permissao", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ApiError" }, "example": { "ok": false, "error": { "code": "FORBIDDEN", "message": "You do not have access to this resource." } } } } },
      "NotFound": { "description": "Recurso ausente no tenant ou funcionalidade desabilitada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ApiError" }, "example": { "ok": false, "error": { "code": "NOT_FOUND", "message": "Case not found." } } } } },
      "Conflict": { "description": "Conflito de idempotencia, estado ou pre-condicao", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ApiError" }, "example": { "ok": false, "error": { "code": "IDEMPOTENCY_CONFLICT", "message": "Idempotency key conflicts with existing evidence." } } } } },
      "RateLimited": { "description": "Limite de requisicoes excedido", "headers": { "Retry-After": { "schema": { "type": "integer" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ApiError" } } } }
    }
  }
}
