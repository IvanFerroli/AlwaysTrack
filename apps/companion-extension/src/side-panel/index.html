<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copiloto SAC</title>
    <link rel="stylesheet" href="./side-panel.css" />
  </head>
  <body>
    <main class="shell">
      <header class="panel-header">
        <div class="brand-line"><span class="product">AlwaysTrack</span><span id="host-status" class="connection-status">Companion indisponivel</span></div>
        <h1>Copiloto SAC</h1>
        <div id="case-head" class="case-head" aria-label="Contexto do caso"></div>
        <div class="completion" role="progressbar" aria-label="Completude do caso" aria-valuemin="0" aria-valuemax="100"><span id="completion-bar"></span></div>
        <div class="header-actions">
          <button id="refresh-case" type="button" class="icon-button" title="Atualizar caso" aria-label="Atualizar caso">&#8635;</button>
          <button id="cancel-case" type="button" class="icon-button danger-button" title="Cancelar sessao" aria-label="Cancelar sessao">&#215;</button>
        </div>
      </header>

      <p id="browser-diagnostics" class="diagnostics" aria-live="polite"></p>
      <section id="intervention" class="intervention" aria-live="polite" hidden></section>
      <aside id="plan-update" class="plan-update" role="status" aria-live="polite" hidden></aside>

      <section class="workspace-section current-step-section">
        <div id="stepper"></div>
      </section>

      <section class="workspace-section action-section" aria-labelledby="actions-title">
        <h2 id="actions-title">Copiar conteudo</h2>
        <div id="copy-actions"></div>
      </section>

      <details class="supporting-section">
        <summary>Resumo e montagem</summary>
        <div id="summary" class="summary-copy"></div>
        <ul id="connectors" class="connectors"></ul>
      </details>

      <details class="supporting-section">
        <summary>Fluxos detectados</summary>
        <div id="detected-flows"></div>
      </details>

      <details class="supporting-section">
        <summary>Mapa de possibilidades</summary>
        <div id="possibilities" class="possibilities"></div>
      </details>

      <details class="supporting-section shortcut-settings">
        <summary>Preferencias de teclado</summary>
        <label for="shortcut-mode">Atalhos para escolher opcoes</label>
        <select id="shortcut-mode">
          <option value="DIRECT">Teclas 1 a 9</option>
          <option value="ALT">Alt + teclas 1 a 9</option>
          <option value="DISABLED">Desativados</option>
        </select>
      </details>
    </main>
    <script type="module" src="./side-panel.ts"></script>
  </body>
</html>
